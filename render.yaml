services:
  - type: web
    name: jpspg-game-server
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile --no-prod && pnpm exec tsup apps/game-server/src/index.ts --format esm --platform node --target node22 --out-dir dist/server --no-splitting
    startCommand: pnpm exec tsx apps/game-server/src/index.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: STORAGE_MODE
        value: supabase
      - key: SESSION_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VOICE_ENABLED
        value: 'false'
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: MINIMUM_AGE
        value: '13'
      - key: CHAT_RETENTION_DAYS
        value: '90'
